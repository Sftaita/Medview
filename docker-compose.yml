services:
  database:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-app}
      POSTGRES_USER: ${POSTGRES_USER:-app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-!ChangeMe!}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - database_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${POSTGRES_USER:-app}", "-d", "${POSTGRES_DB:-app}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 20s

  # Dev-only SMTP catcher: no email ever leaves the machine, and the UI
  # (http://localhost:8026) is the only way to read an invitation link in
  # dev, since only the token's hash is stored (docs/authentication.md §15).
  mailpit:
    image: axllent/mailpit
    ports:
      - "${MAILPIT_UI_PORT:-8026}:8025"

  backend:
    build:
      context: ./backend
    volumes:
      - ./backend:/app
      # vendor/ and var/ are excluded from the bind mount and kept in native
      # Docker volumes: syncing thousands of small files across the Windows
      # bind mount is slow enough to blow past PHP's max_execution_time.
      - backend_vendor:/app/vendor
      - backend_var:/app/var
    ports:
      - "${BACKEND_PORT:-8000}:80"
    # APP_ENV is intentionally NOT set here: it's controlled by backend/.env
    # (and forced to "test" by phpunit.dist.xml for test runs). Setting it as
    # a real container env var would populate $_ENV, which Symfony's
    # KernelTestCase checks *before* the value PHPUnit forces into $_SERVER,
    # silently making every test run boot the dev kernel instead of test.
    depends_on:
      database:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    environment:
      VITE_API_URL: ${VITE_API_URL:-http://localhost:8000}
    depends_on:
      - backend

volumes:
  database_data:
  frontend_node_modules:
  backend_vendor:
  backend_var:
