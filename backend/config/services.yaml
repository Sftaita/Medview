# yaml-language-server: $schema=../vendor/symfony/dependency-injection/Loader/schema/services.schema.json

# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.
# See also https://symfony.com/doc/current/service_container/import.html

# Put parameters here that don't need to change on each machine where the app is deployed
# https://symfony.com/doc/current/best_practices.html#use-parameters-for-application-configuration
parameters:

services:
    # default configuration for services in *this* file
    _defaults:
        autowire: true      # Automatically injects dependencies in your services.
        autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.
        bind:
            # Shared by RefreshTokenService (DB row lifetime) and
            # RefreshTokenCookieFactory (cookie Max-Age) — they must match.
            $ttlSeconds: '%env(int:REFRESH_TOKEN_TTL)%'
            # Cookie Secure flag: must be true wherever the app is served
            # over HTTPS. See docs/authentication.md for per-environment values.
            $secure: '%env(bool:COOKIE_SECURE)%'

    # makes classes in src/ available to be used as services
    # this creates a service per class whose id is the fully-qualified class name
    App\:
        resource: '../src/'

    # add more service definitions when explicit configuration is needed
    # please note that last definitions always *replace* previous ones

    # Planning-domain services (docs/planning-domain.md) have no consumer
    # yet — this lot deliberately ships no controllers/endpoints (next
    # lot's job). With zero references anywhere, Symfony's container
    # compiler would otherwise remove them entirely as dead code, which
    # would also make them unreachable from integration tests via
    # self::getContainer()->get(...). Marked public here as a documented,
    # temporary exception; safe to drop once a real controller consumes
    # each one (a real consumer keeps a private service alive on its own).
    App\Service\TeamMembershipService:
        public: true
    App\Service\ParticipationPeriodService:
        public: true
    App\Service\FairnessPeriodService:
        public: true
    App\Service\PlanningPeriodLifecycleService:
        public: true
    App\Service\PlanningRuleSetService:
        public: true
    App\Service\DutyMaterializationService:
        public: true
