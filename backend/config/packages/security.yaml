security:
    # https://symfony.com/doc/current/security.html#registering-the-user-hashing-passwords
    password_hashers:
        App\Entity\User: 'auto'

    # https://symfony.com/doc/current/security.html#loading-the-user-the-user-provider
    providers:
        app_user_provider:
            # No `property:`: UserRepository::loadUserByIdentifier() does the
            # (case-insensitive) lookup — see docs/authentication.md §15.
            entity:
                class: App\Entity\User

    firewalls:
        dev:
            # Ensure dev tools and static assets are always allowed
            pattern: ^/(_profiler|_wdt|assets|build)/
            security: false

        # Handles POST /api/login: Symfony's json_login authenticator reads
        # the credentials; on success App\Security\LoginSuccessHandler issues
        # a JWT + a refresh-token cookie (see docs/authentication.md).
        # login_throttling protects against brute-force: 5 attempts / 15min,
        # keyed by username+IP *and* a higher-ceiling IP-only limit (both
        # native to Symfony — see DefaultLoginRateLimiter).
        login:
            pattern: ^/api/login
            stateless: true
            user_checker: App\Security\UserChecker
            login_throttling:
                max_attempts: 5
                interval: '15 minutes'
            json_login:
                check_path: api_login
                username_path: email
                password_path: password
                success_handler: App\Security\LoginSuccessHandler
                failure_handler: App\Security\LoginFailureHandler

        # SurgicalHub's server, machine-to-machine (docs/surgicalhub-integration.md
        # §3.1): a dedicated Bearer secret, never a JWT and never a User. Placed
        # before `api` so these routes never accept a MedVue access token, and
        # this secret is meaningless anywhere else.
        surgicalhub_integration:
            pattern: ^/api/integrations/surgicalhub/
            stateless: true
            custom_authenticators:
                - App\Security\SurgicalHubIntegrationAuthenticator

        # Every other /api route must present a valid JWT. /api/token/refresh
        # and /api/token/logout are carved out below (access_control) since
        # they authenticate via the HttpOnly cookie instead, checked
        # manually in their controllers.
        api:
            pattern: ^/api
            stateless: true
            user_checker: App\Security\UserChecker
            jwt: ~

    # Note: Only the *first* matching rule is applied
    access_control:
        - { path: ^/api/health, roles: PUBLIC_ACCESS }
        - { path: ^/api/register, roles: PUBLIC_ACCESS }
        # An invitation link is opened by someone who has no account yet, so
        # looking one up is public; accepting an invitation
        # (POST /api/invitations/{token}/accept) falls through to the
        # authenticated catch-all below.
        - { path: '^/api/invitations/[^/]+$', methods: [GET], roles: PUBLIC_ACCESS }
        - { path: ^/api/login, roles: PUBLIC_ACCESS }
        - { path: ^/api/token/refresh, roles: PUBLIC_ACCESS }
        - { path: ^/api/token/logout, roles: PUBLIC_ACCESS }
        # The reset token itself is the credential (checked manually in
        # PasswordResetService), never a Bearer JWT — same reasoning as the
        # invitation lookup above.
        - { path: ^/api/password-reset/request, roles: PUBLIC_ACCESS }
        - { path: ^/api/password-reset/confirm, roles: PUBLIC_ACCESS }
        # Polled by Google Calendar, Apple Calendar and Outlook, which send no
        # JWT: the secret token in the path is the credential (read-only, one
        # person's duties — docs/decisions.md D170).
        - { path: '^/api/calendar-feeds/[0-9a-f]{64}\.ics$', methods: [GET, HEAD], roles: PUBLIC_ACCESS }
        # Platform administration (docs/admin.md, D174): the global
        # ROLE_PLATFORM_ADMIN only — never a team OWNER/ADMIN role. Roles are
        # reloaded from the database on every request, so a revocation
        # applies to the next one. Each controller re-checks with #[IsGranted].
        - { path: ^/api/admin, roles: ROLE_PLATFORM_ADMIN }
        - { path: ^/api/integrations/surgicalhub/, roles: ROLE_SURGICALHUB_INTEGRATION }
        - { path: ^/api, roles: IS_AUTHENTICATED_FULLY }

when@test:
    security:
        password_hashers:
            # Password hashers are resource-intensive by design to ensure security.
            # In tests, it's safe to reduce their cost to improve performance.
            App\Entity\User:
                algorithm: auto
                cost: 4 # Lowest possible value for bcrypt
                time_cost: 3 # Lowest possible value for argon
                memory_cost: 10 # Lowest possible value for argon
