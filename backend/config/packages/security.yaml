security:
    # https://symfony.com/doc/current/security.html#registering-the-user-hashing-passwords
    password_hashers:
        App\Entity\User: 'auto'

    # https://symfony.com/doc/current/security.html#loading-the-user-the-user-provider
    providers:
        app_user_provider:
            entity:
                class: App\Entity\User
                property: email

    firewalls:
        dev:
            # Ensure dev tools and static assets are always allowed
            pattern: ^/(_profiler|_wdt|assets|build)/
            security: false

        # Handles POST /api/login: Symfony's json_login authenticator reads
        # the credentials; on success App\Security\LoginSuccessHandler issues
        # a JWT + a refresh-token cookie (see docs/authentication.md).
        # login_throttling protects against brute-force: 5 attempts / 15min,
        # keyed by username+IP *and* a higher-ceiling IP-only limit (both
        # native to Symfony — see DefaultLoginRateLimiter).
        login:
            pattern: ^/api/login
            stateless: true
            user_checker: App\Security\UserChecker
            login_throttling:
                max_attempts: 5
                interval: '15 minutes'
            json_login:
                check_path: api_login
                username_path: email
                password_path: password
                success_handler: App\Security\LoginSuccessHandler
                failure_handler: App\Security\LoginFailureHandler

        # Every other /api route must present a valid JWT. /api/token/refresh
        # and /api/token/logout are carved out below (access_control) since
        # they authenticate via the HttpOnly cookie instead, checked
        # manually in their controllers.
        api:
            pattern: ^/api
            stateless: true
            user_checker: App\Security\UserChecker
            jwt: ~

    # Note: Only the *first* matching rule is applied
    access_control:
        - { path: ^/api/health, roles: PUBLIC_ACCESS }
        - { path: ^/api/register, roles: PUBLIC_ACCESS }
        - { path: ^/api/login, roles: PUBLIC_ACCESS }
        - { path: ^/api/token/refresh, roles: PUBLIC_ACCESS }
        - { path: ^/api/token/logout, roles: PUBLIC_ACCESS }
        - { path: ^/api, roles: IS_AUTHENTICATED_FULLY }

when@test:
    security:
        password_hashers:
            # Password hashers are resource-intensive by design to ensure security.
            # In tests, it's safe to reduce their cost to improve performance.
            App\Entity\User:
                algorithm: auto
                cost: 4 # Lowest possible value for bcrypt
                time_cost: 3 # Lowest possible value for argon
                memory_cost: 10 # Lowest possible value for argon
