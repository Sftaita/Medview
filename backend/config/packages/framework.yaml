# see https://symfony.com/doc/current/reference/configuration/framework.html
framework:
    secret: '%env(APP_SECRET)%'

    # Note that the session will be started ONLY if you read or write from it.
    session: true

    # Domain refusals that carry their own answer (409/422, rendered by
    # ApiExceptionListener — docs/decisions.md D187) are expected outcomes:
    # logged as information, never as critical errors.
    exceptions:
        App\Exception\ApiProblem:
            log_level: info

    #esi: true
    #fragments: true

when@test:
    framework:
        test: true
        # Every outgoing HTTP request in tests (SurgicalHub) is answered by
        # App\Tests\FakeSurgicalHub — never the network.
        http_client:
            mock_response_factory: App\Tests\FakeSurgicalHub
        session:
            storage_factory_id: session.storage.factory.mock_file
