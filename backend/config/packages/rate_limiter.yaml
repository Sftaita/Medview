# Login is throttled natively by security.yaml's `login_throttling` option
# (keyed by username+IP automatically) — nothing to declare here for it.
#
# Registration has no authenticator/firewall to hook into (it's a plain
# controller), so it uses this named limiter directly, keyed by IP.
#
# Storage: the default `cache.rate_limiter` pool, backed by `cache.app`
# (filesystem by default — see config/packages/cache.yaml). That means the
# counters are per-instance: running several backend replicas in production
# needs a shared backend (e.g. Redis) or one instance's limiter won't see
# another's attempts. Documented in docs/authentication.md.
framework:
    rate_limiter:
        register:
            policy: 'sliding_window'
            limit: 5
            interval: '1 hour'
        # Public, unauthenticated read (docs/authentication.md §15), keyed by
        # client IP: the invitation lookup is a token oracle that must not
        # be brute-forceable.
        invitation_lookup:
            policy: 'sliding_window'
            limit: 30
            interval: '1 minute'
        # Authenticated, keyed by user: caps how many emails one account can
        # make MedVue send per hour (invitation spam / address probing).
        team_invitation:
            policy: 'sliding_window'
            limit: 100
            interval: '1 hour'
        # POST /api/password-reset/request — public, unauthenticated, and its
        # response never reveals whether the email exists (docs/authentication.md).
        # Double protection, both consumed unconditionally on every request so
        # the 429 boundary itself never becomes an account-existence oracle:
        #  - IP: aligned on `register`'s ceiling, same reasoning (one visitor
        #    should rarely need more than a handful of reset attempts/hour).
        #  - email (keyed by a SHA-256 of the normalized address, never the
        #    address itself, see PasswordResetRequestController): tighter,
        #    protects one target mailbox from being mail-bombed with reset
        #    links regardless of which IP(s) the requests come from.
        password_reset_request_ip:
            policy: 'sliding_window'
            limit: 5
            interval: '1 hour'
        password_reset_request_email:
            policy: 'sliding_window'
            limit: 3
            interval: '1 hour'
        # SurgicalHub association codes (docs/surgicalhub-integration.md §4.2).
        # Generating one, keyed by user: a person needs a handful at most.
        surgicalhub_link_code:
            policy: 'sliding_window'
            limit: 10
            interval: '1 hour'
        # POST /api/integrations/surgicalhub/v1/link-codes/redeem, keyed by client
        # IP — in practice SurgicalHub's server (which also limits each of its users).
        # With 60 random bits per code valid 10 minutes, it only caps abuse.
        surgicalhub_redeem:
            policy: 'sliding_window'
            limit: 60
            interval: '1 minute'
        # « Synchroniser SurgicalHub », keyed by user: the cron already runs every
        # 30 minutes, a person rarely needs more than a few manual refreshes.
        surgicalhub_manual_sync:
            policy: 'sliding_window'
            limit: 10
            interval: '1 hour'
